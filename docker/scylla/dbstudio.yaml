# ScyllaDB settings of the test container, passed with `--options-file` (the image only reads
# /etc/scylla/scylla.yaml otherwise). Password authentication and a TLS native-transport port
# (9142) using the test certificate generated by docker/gen-certs.sh.
authenticator: PasswordAuthenticator
authorizer: CassandraAuthorizer
native_transport_port: 9042
native_transport_port_ssl: 9142
client_encryption_options:
  enabled: true
  certificate: /certs/scylla.crt
  keyfile: /certs/scylla.key
  require_client_auth: false
