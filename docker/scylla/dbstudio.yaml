# Extra ScyllaDB settings for the test container: mounted into /etc/scylla.d/ (read after
# scylla.yaml). Password authentication and a TLS native-transport port (9142) using the test CA
# certificate generated by docker/gen-certs.sh. Package C may adjust this file.
authenticator: PasswordAuthenticator
authorizer: CassandraAuthorizer
client_encryption_options:
  enabled: true
  certificate: /certs/scylla.crt
  keyfile: /certs/scylla.key
  require_client_auth: false
