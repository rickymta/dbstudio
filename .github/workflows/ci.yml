name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly run of the heavy / old-version service groups (`integration-extra`).
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies for Tauri 2
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # The Tauri crate embeds ../dist at compile time, so build the frontend first.
      - run: pnpm build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Also lint with every optional feature switched on (dev-bridge and friends).
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      # Keep the debug-only dev bridge feature compiling and tested.
      - run: cargo clippy -p dbstudio --features dev-bridge --all-targets -- -D warnings
      - run: cargo test -p dbstudio --features dev-bridge

  # Integration tests, one matrix entry per group of services so the CI machine never runs every
  # database at once (see docker/compose.test.yml: new services live in profiles and a profile is
  # started by naming its services). DBSTUDIO_IT_STRICT lists the services of the group (names as in
  # the compose file): a missing container of a listed service fails instead of skipping, tests of
  # other services still skip. `heavy` and `extra` run weekly in `integration-extra`.
  integration:
    name: Integration tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every service without a profile: PostgreSQL 12/16, MySQL 5.7/8, MariaDB 10.4/10.6,
          # SQL Server 2022, Oracle Free, MongoDB 4.4/7 (rs0 initiated by its healthcheck),
          # Redis 6/7, Valkey 8, sshd. MySQL 5.7 runs under emulation: generous timeouts.
          - group: core
            services: ''
            profile: ''
            strict: pg16,pg12,mysql8,mariadb,mariadb104,mysql57,mssql2022,oraclefree,mongo44,mongo7,redis6,redis7,valkey8,sshd
            test: cargo test --workspace -- --test-threads=2
            oracle: true
          # CQL: ScyllaDB (+TLS) and Cassandra 5.
          - group: wide
            services: scylla cassandra5 sshd
            profile: wide
            strict: scylla,cassandra5,sshd
            test: |
              cargo test -p dbstudio-driver-cassandra -- --test-threads=2
              cargo test -p dbstudio-export --test it_newdb -- scylla cassandra5 --test-threads=2
              cargo test -p dbstudio-backup --test it_newdb -- scylla cassandra5 --test-threads=2
          # ClickHouse 26.3 (HTTP + HTTPS).
          - group: analytics
            services: clickhouse26 sshd
            profile: analytics
            strict: clickhouse26,sshd
            test: |
              cargo test -p dbstudio-driver-clickhouse -- --test-threads=2
              cargo test -p dbstudio-export --test it_newdb -- clickhouse --test-threads=2
              cargo test -p dbstudio-backup --test it_newdb -- clickhouse --test-threads=2
          # CockroachDB and TiDB: the flavour tests live in the PostgreSQL / MySQL driver crates
          # (test targets `it_flavor` / `it_tidb`).
          - group: newsql
            services: cockroach tidb sshd
            profile: newsql
            strict: cockroach,tidb,sshd
            test: |
              cargo test -p dbstudio-driver-postgres --test it_flavor -- --test-threads=2
              cargo test -p dbstudio-driver-mysql --test it_tidb -- --test-threads=2
              cargo test -p dbstudio-export --test it_newdb -- cockroach tidb --test-threads=2
              cargo test -p dbstudio-backup --test it_newdb -- cockroach tidb --test-threads=2
          # SQL debugger: PostgreSQL 16 + pldebugger (image built from docker/pg16dbg). Tests of
          # the routine debugger carry `pgdbg` in their names.
          - group: debug
            services: pg16dbg
            profile: debug
            strict: pg16dbg
            test: cargo test -p dbstudio-debug -- pgdbg --test-threads=2
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The Tauri crate embeds ../dist at compile time, so build the frontend first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Generate test certificates and SSH keys
        run: |
          sh docker/gen-certs.sh
          sh docker/gen-ssh-keys.sh

      - name: Start test databases
        timeout-minutes: 25
        run: |
          if [ -z "${{ matrix.profile }}" ]; then
            docker compose -f docker/compose.test.yml up -d --wait --wait-timeout 900
          else
            docker compose -f docker/compose.test.yml --profile "${{ matrix.profile }}" \
              up -d --wait --wait-timeout 900 ${{ matrix.services }}
          fi

      - name: Run integration tests
        env:
          DBSTUDIO_IT: '1'
          DBSTUDIO_IT_STRICT: ${{ matrix.strict }}
          DBSTUDIO_IT_MSSQL_PORT: '14333'
          DBSTUDIO_IT_ORACLE_PORT: '15213'
          DBSTUDIO_IT_MONGO44_PORT: '27044'
          DBSTUDIO_IT_MONGO7_PORT: '27077'
          DBSTUDIO_IT_REDIS6_PORT: '63796'
          DBSTUDIO_IT_REDIS7_PORT: '63797'
          DBSTUDIO_IT_VALKEY8_PORT: '63798'
          DBSTUDIO_IT_SSH_PORT: '22022'
          DBSTUDIO_IT_SCYLLA_PORT: '19060'
          DBSTUDIO_IT_SCYLLA_TLS_PORT: '19062'
          DBSTUDIO_IT_CASSANDRA5_PORT: '19050'
          DBSTUDIO_IT_CLICKHOUSE_PORT: '18123'
          DBSTUDIO_IT_CLICKHOUSE_TLS_PORT: '18443'
          DBSTUDIO_IT_COCKROACH_PORT: '26258'
          DBSTUDIO_IT_TIDB_PORT: '34000'
          DBSTUDIO_IT_PGDBG_PORT: '54317'
        shell: bash
        run: |
          set -o pipefail
          { ${{ matrix.test }}
          } 2>&1 | tee it.log

      # Turn failing tests into annotations (readable without downloading logs).
      - name: Summarize failing tests
        if: failure()
        shell: bash
        run: |
          [ -f it.log ] || exit 0
          grep -E "^test .* FAILED|panicked at|^thread '.*' panicked" -A 3 it.log | grep -v '^--$' | head -60 \
            | while IFS= read -r line; do echo "::error title=integration::${line//%/%25}"; done

      # The Oracle driver needs Instant Client (a Linux build of it lives in the oracle-it image),
      # so its tests run in a container on the compose network instead of on the runner.
      - name: Run Oracle driver integration tests
        if: matrix.oracle
        timeout-minutes: 30
        run: docker compose -f docker/compose.test.yml --profile tools run --rm oracle-it

      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f docker/compose.test.yml --profile ${{ matrix.profile || 'tools' }} logs --no-color

      - name: Stop test databases
        if: always()
        run: docker compose -f docker/compose.test.yml --profile ${{ matrix.profile || 'tools' }} down -v

  # Weekly: YugabyteDB (heavy, ~2 GB) and the oldest versions of the new databases. May fail while
  # their IT suites are young, so it never blocks a merge.
  integration-extra:
    name: Integration tests (${{ matrix.group }}, weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: heavy
            services: yugabyte sshd
            strict: yugabyte,sshd
            test: |
              cargo test -p dbstudio-driver-postgres --test it_flavor -- --test-threads=1
              cargo test -p dbstudio-export --test it_newdb -- yugabyte --test-threads=2
              cargo test -p dbstudio-backup --test it_newdb -- yugabyte --test-threads=2
          - group: extra
            services: cassandra41 scylla62 clickhouse23 sshd
            strict: cassandra41,scylla62,clickhouse23,sshd
            test: |
              cargo test -p dbstudio-driver-cassandra -- --test-threads=2
              cargo test -p dbstudio-driver-clickhouse -- --test-threads=2
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Generate test certificates and SSH keys
        run: |
          sh docker/gen-certs.sh
          sh docker/gen-ssh-keys.sh

      - name: Start test databases
        timeout-minutes: 25
        run: |
          docker compose -f docker/compose.test.yml --profile ${{ matrix.group }} \
            up -d --wait --wait-timeout 900 ${{ matrix.services }}

      - name: Run integration tests
        env:
          DBSTUDIO_IT: '1'
          DBSTUDIO_IT_STRICT: ${{ matrix.strict }}
          DBSTUDIO_IT_SSH_PORT: '22022'
          DBSTUDIO_IT_YUGABYTE_PORT: '54333'
          DBSTUDIO_IT_CASSANDRA41_PORT: '19041'
          DBSTUDIO_IT_SCYLLA62_PORT: '19061'
          DBSTUDIO_IT_CLICKHOUSE23_PORT: '18023'
        shell: bash
        run: |
          set -o pipefail
          { ${{ matrix.test }}
          } 2>&1 | tee it.log

      # Turn failing tests into annotations (readable without downloading logs).
      - name: Summarize failing tests
        if: failure()
        shell: bash
        run: |
          [ -f it.log ] || exit 0
          grep -E "^test .* FAILED|panicked at|^thread '.*' panicked" -A 3 it.log | grep -v '^--$' | head -60 \
            | while IFS= read -r line; do echo "::error title=integration::${line//%/%25}"; done

      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f docker/compose.test.yml --profile ${{ matrix.group }} logs --no-color

      - name: Stop test databases
        if: always()
        run: docker compose -f docker/compose.test.yml --profile ${{ matrix.group }} down -v
