name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri 2
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # The Tauri crate embeds ../dist at compile time, so build the frontend first.
      - run: pnpm build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Keep the debug-only dev bridge feature compiling and tested.
      - run: cargo clippy -p dbstudio --features dev-bridge --all-targets -- -D warnings
      - run: cargo test -p dbstudio --features dev-bridge

  integration:
    name: Integration tests (PostgreSQL + MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The Tauri crate embeds ../dist at compile time, so build the frontend first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Generate test certificates
        run: sh docker/gen-certs.sh

      # Pulls PostgreSQL 12/16, MySQL 5.7/8, MariaDB 10.4/10.6; images are large and MySQL 5.7
      # runs under emulation, so allow generous time for pulls and health checks.
      - name: Start test databases
        timeout-minutes: 15
        run: docker compose -f docker/compose.test.yml up -d --wait --wait-timeout 600

      - name: Run integration tests
        run: DBSTUDIO_IT=1 cargo test --workspace

      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f docker/compose.test.yml logs --no-color

      - name: Stop test databases
        if: always()
        run: docker compose -f docker/compose.test.yml down -v
