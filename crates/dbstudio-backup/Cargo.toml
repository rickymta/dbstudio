[package]
name = "dbstudio-backup"
description = "Backup, restore, verification and scheduling for DBStudio (.dbsbak container, native tools)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
dbstudio-core.workspace = true
dbstudio-export.workspace = true
dbstudio-sql.workspace = true
dbstudio-ssh.workspace = true
dbstudio-store.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
chrono.workspace = true
croner.workspace = true
fd-lock.workspace = true
flate2.workspace = true
serde.workspace = true
tempfile.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["process", "rt", "sync", "macros", "io-util", "time"] }
tracing.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
dbstudio-core = { workspace = true, features = ["testing"] }
async-trait.workspace = true
dbstudio-driver-postgres = { path = "../drivers/postgres" }
dbstudio-driver-mysql = { path = "../drivers/mysql" }

[lints]
workspace = true
