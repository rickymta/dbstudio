[package]
name = "dbstudio-driver-redis"
description = "Redis / Valkey driver for DBStudio."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
dbstudio-core.workspace = true
dbstudio-sql.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "net"] }
uuid.workspace = true
redis.workspace = true
rustls = { workspace = true, features = ["ring"] }

[dev-dependencies]
dbstudio-core = { workspace = true, features = ["testing"] }
dbstudio-ssh.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
