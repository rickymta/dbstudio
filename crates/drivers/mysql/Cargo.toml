[package]
name = "dbstudio-driver-mysql"
description = "MySQL / MariaDB driver for DBStudio."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
dbstudio-core.workspace = true
dbstudio-sql.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
uuid.workspace = true
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
dbstudio-plan.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
