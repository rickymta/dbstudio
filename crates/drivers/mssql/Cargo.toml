[package]
name = "dbstudio-driver-mssql"
description = "Microsoft SQL Server driver for DBStudio."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
rustls = { workspace = true, features = ["ring"] }
dbstudio-core.workspace = true
dbstudio-sql.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json.workspace = true
tiberius.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "net"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
uuid.workspace = true

# The operating system's TLS library (SChannel, Security.framework) as a second backend for SQL
# Server 2008 / 2008 R2 and other servers that offer only TLS 1.0/1.1 or legacy cipher suites.
# Not on Linux: that would need OpenSSL in the bundles.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tiberius = { workspace = true, features = ["native-tls"] }

[dev-dependencies]
dbstudio-core = { workspace = true, features = ["testing"] }
quick-xml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
