[package]
name = "dbstudio-driver-mssql"
description = "Microsoft SQL Server driver for DBStudio."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
dbstudio-core.workspace = true
dbstudio-sql.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex.workspace = true
serde_json.workspace = true
tiberius.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "net"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
dbstudio-core = { workspace = true, features = ["testing"] }
quick-xml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
