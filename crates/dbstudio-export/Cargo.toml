[package]
name = "dbstudio-export"
description = "Data export and import (SQL, CSV, XLSX, JSON) for DBStudio."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
dbstudio-core.workspace = true
dbstudio-sql.workspace = true
dbstudio-store.workspace = true
calamine.workspace = true
rust_xlsxwriter = { workspace = true, features = ["constant_memory"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
uuid.workspace = true
async-trait.workspace = true
zip.workspace = true
base64.workspace = true
time.workspace = true
regex.workspace = true

[dev-dependencies]
dbstudio-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
dbstudio-driver-postgres = { path = "../drivers/postgres" }
dbstudio-driver-mysql = { path = "../drivers/mysql" }
dbstudio-driver-redis = { path = "../drivers/redis" }
dbstudio-driver-cassandra = { path = "../drivers/cassandra" }
dbstudio-driver-clickhouse = { path = "../drivers/clickhouse" }
dbstudio-driver-mongodb = { path = "../drivers/mongodb" }

[lints]
workspace = true
