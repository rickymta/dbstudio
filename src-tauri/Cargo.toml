[package]
name = "dbstudio"
description = "DBStudio desktop application (thin Tauri shell around dbstudio-core)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "dbstudio"

[lib]
name = "dbstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
rustls = { workspace = true, features = ["ring"] }
# Help & Support form (commands/support.rs). No bundled crypto provider: ring is installed at run time.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
dbstudio-core.workspace = true
dbstudio-sql.workspace = true
dbstudio-plan.workspace = true
dbstudio-export.workspace = true
dbstudio-backup.workspace = true
dbstudio-ssh.workspace = true
dbstudio-debug.workspace = true
dbstudio-driver-mysql = { version = "0.2.0", path = "../crates/drivers/mysql", optional = true }
dbstudio-driver-postgres = { version = "0.2.0", path = "../crates/drivers/postgres", optional = true }
dbstudio-driver-mssql = { version = "0.2.0", path = "../crates/drivers/mssql", optional = true }
dbstudio-driver-oracle = { version = "0.2.0", path = "../crates/drivers/oracle", optional = true }
dbstudio-driver-mongodb = { version = "0.2.0", path = "../crates/drivers/mongodb", optional = true }
dbstudio-driver-cassandra = { version = "0.2.0", path = "../crates/drivers/cassandra", optional = true }
dbstudio-driver-clickhouse = { version = "0.2.0", path = "../crates/drivers/clickhouse", optional = true }
dbstudio-driver-redis = { version = "0.2.0", path = "../crates/drivers/redis", optional = true }
axum = { workspace = true, optional = true }
base64.workspace = true
dbstudio-store = { version = "0.2.0", path = "../crates/dbstudio-store" }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2"
# Used from Rust only (no webview capability): OS notifications, launch at login, single instance.
tauri-plugin-notification = "2.8"
tauri-plugin-autostart = "2.7"
# Dependency only for now; registered by package H together with the tray.
tauri-plugin-single-instance = "2.5"
async-trait.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time", "rt", "sync"] }
tokio-stream = { workspace = true, optional = true }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[features]
default = ["postgres", "mysql", "mssql", "oracle", "mongodb", "redis", "cassandra", "clickhouse"]
postgres = ["dep:dbstudio-driver-postgres"]
mysql = ["dep:dbstudio-driver-mysql"]
mssql = ["dep:dbstudio-driver-mssql"]
oracle = ["dep:dbstudio-driver-oracle"]
mongodb = ["dep:dbstudio-driver-mongodb"]
redis = ["dep:dbstudio-driver-redis"]
# `clickhouse` is not in `default` yet (package H).
cassandra = ["dep:dbstudio-driver-cassandra"]
clickhouse = ["dep:dbstudio-driver-clickhouse"]
# Enabled by `tauri build`; also what makes a bundle load the embedded frontend.
custom-protocol = ["tauri/custom-protocol"]
# Debug-only HTTP bridge so a browser UI can drive the real backend. Never enable in release.
dev-bridge = ["dep:axum", "dep:tokio-stream", "tokio/net"]

[lints]
workspace = true

[dev-dependencies]
dbstudio-core = { workspace = true, features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
