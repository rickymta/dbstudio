[workspace]
members = ["src-tauri", "crates/dbstudio-*", "crates/drivers/*"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.94"
authors = ["DBStudio contributors"]
repository = "https://github.com/rickymta/dbstudio"

[workspace.dependencies]
dbstudio-core = { path = "crates/dbstudio-core" }
async-trait = "0.1.92"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting"] }
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
keyring = "4.2.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time", "io-util", "fs", "net", "process"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

# Phase 2-8 dependencies (declared centrally by the contract scaffold; crates opt in with `.workspace = true`).
dbstudio-sql = { path = "crates/dbstudio-sql" }
dbstudio-store = { path = "crates/dbstudio-store" }
dbstudio-plan = { path = "crates/dbstudio-plan" }
dbstudio-export = { path = "crates/dbstudio-export" }
dbstudio-backup = { path = "crates/dbstudio-backup" }
dbstudio-ssh = { path = "crates/dbstudio-ssh" }
dbstudio-debug = { path = "crates/dbstudio-debug" }
quick-xml = "0.42"
rust_xlsxwriter = "0.102"
calamine = "0.38"
zip = "9.5"
tar = "0.4"
flate2 = "1.1"
zstd = "0.14"
aes-gcm = "0.11"
argon2 = "0.6"
sha2 = "0.11"
croner = "4"
chrono = { version = "0.4", features = ["serde", "clock"] }
fd-lock = "4"
clap = { version = "4.6", features = ["derive"] }
russh = "0.65"
tokio-util = "0.7"
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "winauth", "tokio-util", "time"] }
oracle = "0.6.3"
mongodb = { version = "3.10", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver", "socks5-proxy"] }
bson = "3.1"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "streams", "acl"] }
rustls = "0.23"
rustls-native-certs = "0.8"
proptest = "1"

# Backlog + phase 9 (declared centrally by the contract v2 scaffold; crates opt in with `.workspace = true`).
scylla = { version = "1.10.0", default-features = false, features = ["rustls-023"] }
clickhouse = { version = "0.15.3", default-features = false, features = ["lz4", "rustls-tls-ring", "rustls-tls-native-roots"] }
hyper-util = "0.1.21"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring"] }
sys-locale = "0.3.2"

# Minimal fork of tiberius 0.13.0 (see vendor/tiberius-patch/DBSTUDIO-PATCH.md): INFO/DONE items,
# cooperative attention (cancel) and exact money decoding.
[patch.crates-io]
tiberius = { path = "vendor/tiberius-patch" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `rust-version = "1.94"` turns on let-chain suggestions (~100 mechanical edits across files that
# parallel packages own). Allowed until package Z cleans them up in one pass.
collapsible_if = "allow"
manual_is_multiple_of = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
